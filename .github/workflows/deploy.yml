name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: signalfeed-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Deploy verified main commit over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

            deploy_path='${{ secrets.DEPLOY_PATH }}'
            verified_sha='${{ github.event.workflow_run.head_sha }}'

            case "$verified_sha" in
              ''|*[!0-9a-f]*)
                echo "Refusing to deploy an invalid commit SHA" >&2
                exit 1
                ;;
            esac
            if [ "${#verified_sha}" -ne 40 ]; then
              echo "Refusing to deploy an invalid commit SHA" >&2
              exit 1
            fi

            cd "$deploy_path"
            mkdir -p data
            exec 9>data/signalfeed.lock
            if ! flock --wait 1800 9; then
              echo "Timed out waiting for the SignalFeed deployment lock" >&2
              exit 1
            fi

            git fetch --prune origin '+refs/heads/main:refs/remotes/origin/main'
            latest_main_sha="$(git rev-parse refs/remotes/origin/main)"
            if [ "$latest_main_sha" != "$verified_sha" ]; then
              echo "Skipping stale workflow for $verified_sha; main is $latest_main_sha"
              exit 0
            fi

            git reset --hard "$verified_sha"
            command -v uv
            uv sync --locked

            flock --unlock 9
            exec 9>&-

            sudo -n systemctl restart signalfeed.timer
            sudo -n systemctl is-active --quiet signalfeed.timer
            sudo -n systemctl status signalfeed.timer --no-pager
